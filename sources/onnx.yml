---
# Metanorma "generic" flavour configuration for the ONNX Standard.
#
# The generic flavour lets a community define its own document class before it
# has an SDO identity of its own. This file is the single place where the
# publisher identity lives, so that the migration path
#
#   generic  ->  Linux Foundation JDF flavour  ->  ISO flavour
#
# only requires changing this file (and the `:mn-document-class:` attribute in
# sources/onnx-std.adoc), not the document body.

organization_name_short: ONNX
organization_name_long: "ONNX Standardization Working Group"
document_namespace: "https://www.metanorma.org/ns/onnx"

# The document identifier is supplied per-document via the `:docidentifier:`
# attribute rather than by a Liquid template here: metanorma-generic passes
# `docid_template` through the AsciiDoc pipeline, where `{{ ... }}` is claimed
# by Metanorma's concept-reference syntax.

# Stages follow the ISO/IEC harmonised stage model so that the eventual move to
# the ISO flavour is a rename, not a redesign.
stage_abbreviations:
  proposal: NP
  preparatory: WD
  committee: CD
  approval: DS
  publication: IS
  withdrawn: WD-DRAFT

published_stages:
  - publication

default_doctype: standard

doctypes:
  - standard
  - specification
  - technical-report
  - guide

# Committee metadata surfaced on the cover page.
committees:
  - "ONNX Standardization Working Group"

# PDF output. The `generic` flavour supports PDF only when both a format list
# including `pdf` and an XSL-FO stylesheet are configured; it ships neither by
# default, which is why `metanorma compile -x pdf` otherwise reports
# "pdf format is not supported for this standard".
#
# Listing `formats` replaces the default (html, doc); the base formats (xml,
# presentation, rxl) are merged in by Metanorma regardless.
formats:
  - html
  - doc
  - pdf

# Path is resolved relative to this file.
pdf_stylesheet: onnx.standard.xsl

# Our own HTML cover page, copied from html_generic_titlepage.html of
# metanorma-generic 3.5.0 with one block changed.
#
# The stock template hard-codes the postal address, e-mail address and website
# of Ribose Inc., the maintainer of the Metanorma toolchain, into the copyright
# notice, and the generic flavour emits them verbatim under whatever publisher
# name the document carries. Published as-is, every HTML part of this standard
# named a company with no connection to it as the place to request rights.
# Ours says what this draft is and points at the repository instead. The Word
# and PDF cover pages carry no address and are untouched.
#
# Path is relative to this file, like pdf_stylesheet above.
htmlcoverpage: onnx.titlepage.html

# Fonts the PDF stylesheet needs, installed by fontist at build time. Without
# STIX Two Math, mn2pdf aborts with
# "Failed to read font file ... STIX2Math.otf"; it is the math font.
#
# The stylesheet also names CJK faces (Noto Sans/Serif JP, KR, SC, TC, HK and
# their Mono variants). They are deliberately left out: they only apply to CJK
# script, this document is English, and they are large to download on every
# build. Add them here if a translation ever needs them.
fonts_manifest:
  Noto Sans:
  Noto Serif:
  Noto Sans Mono:
  STIX Two Math:
