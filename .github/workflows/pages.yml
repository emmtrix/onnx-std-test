name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments rather than cancelling them: a half-finished Pages
# deployment would leave the published site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Fontist downloads the fonts named in sources/onnx.yml on first use.
      # Caching them keeps PDF builds from re-fetching ~100 MB every run.
      - name: Cache Metanorma fonts
        uses: actions/cache@v4
        with:
          path: |
            ~/.fontist
            ~/.metanorma/fonts
          key: metanorma-fonts-${{ hashFiles('sources/onnx.yml') }}
          restore-keys: metanorma-fonts-


      # Fails fast on a malformed stylesheet: mn2pdf parses it and Metanorma
      # exits 0 when that parse fails, producing no PDF silently.
      # The operator clauses of Part 2 are generated. Fails if the committed
      # files are not what the generator produces — a hand edit, or a refresh
      # of upstream/onnx/ without regenerating.
      - name: Check generated operator clauses
        run: bundle exec make check-operators

      - name: Check PDF stylesheet
        run: bundle exec ruby scripts/check-stylesheet.rb

      # `make site` renders the collection into _site/ and then verifies that
      # every expected document is present: `metanorma site generate` exits 0
      # even when a converter failed and wrote nothing.
      - name: Build site
        run: bundle exec make site

      # The site render writes its own diagnostics, separate from those of the
      # `build` workflow, so they are gated here too. Nothing is published if
      # the document has errors of severity 1 or worse.
      - name: Fail on Metanorma errors
        run: |
          rc=0
          for p in 1 2 3; do
            bundle exec ruby scripts/check-errors.rb \
              "_site/documents/part$p/onnx-std-$p.err.html" 1 || rc=1
          done
          exit $rc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
