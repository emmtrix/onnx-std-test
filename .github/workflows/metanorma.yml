name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Fontist downloads the fonts named in sources/onnx.yml on first use.
      # Caching them keeps PDF builds from re-fetching ~100 MB every run.
      - name: Cache Metanorma fonts
        uses: actions/cache@v4
        with:
          path: |
            ~/.fontist
            ~/.metanorma/fonts
          key: metanorma-fonts-${{ hashFiles('sources/onnx.yml') }}
          restore-keys: metanorma-fonts-


      # Fails fast on a malformed stylesheet: mn2pdf parses it and Metanorma
      # exits 0 when that parse fails, producing no PDF silently.
      # The operator clauses of Part 2 are generated. Fails if the committed
      # files are not what the generator produces — a hand edit, or a refresh
      # of upstream/onnx/ without regenerating.
      - name: Check generated operator clauses
        run: bundle exec make check-operators

      # Annex B of Part 1 is generated from upstream/onnx/proto/. Same
      # contract: a hand edit, or a refresh of the vendored schema without
      # regenerating, fails here rather than drifting.
      - name: Check generated schema annex
        run: bundle exec make check-schema

      - name: Check PDF stylesheet
        run: bundle exec ruby scripts/check-stylesheet.rb

      - name: Build HTML, DOC and PDF
        run: bundle exec make pdf

      - name: Fail on Metanorma errors
        run: bundle exec make lint

      - name: Upload rendered standard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onnx-std
          path: |
            sources/part*/onnx-std-*.html
            sources/part*/onnx-std-*.doc
            sources/part*/onnx-std-*.pdf
            sources/part*/onnx-std-*.xml
            sources/part*/onnx-std-*.err.html
          if-no-files-found: warn
