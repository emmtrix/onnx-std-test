name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build HTML and DOC
        run: bundle exec make doc

      - name: Fail on Metanorma errors
        run: bundle exec make lint

      - name: Upload rendered standard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onnx-std
          path: |
            sources/onnx-std.html
            sources/onnx-std.doc
            sources/onnx-std.xml
            sources/onnx-std.err.html
          if-no-files-found: warn
